[project]
name = "trackerkit"
version = "0.3.1"
description = "Unified async client library for Jira, Yandex Tracker, and Asana integrations."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [
    { name = "Mikhail Stasyshin", email = "m.stasyshin@gmail.com" },
]
keywords = ["jira", "yandex-tracker", "asana", "task-tracker", "async", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
    "jira>=3.10.5,<4.0.0",
    "yandex-tracker-client>=2.10,<3.0",
    "asana>=5.2.4,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/depensee-dev/trackerkit"
Repository = "https://github.com/depensee-dev/trackerkit"
Documentation = "https://github.com/depensee-dev/trackerkit#readme"

[tool.poetry]
packages = [{ include = "trackerkit", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # long lines: prefer formatter over hard wraps
    "UP042",  # `(str, Enum)` is intentional; StrEnum changes repr/hash semantics
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

